<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mijelDevNotes</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"/>
  <style>
    :root {
      --theme-color: #3f51b5;
    }
    .sidebar-nav > ul > li > a {
      font-weight: bold;
    }
    .sidebar-nav ul li ul {
      padding-left: 15px;
    }
    .sidebar-nav ul li a {
      transition: all 0.2s ease;
    }
    .sidebar-nav ul li a:hover {
      background: rgba(63, 81, 181, 0.1);
      border-radius: 4px;
    }
    .markdown-section code {
      background-color: #2d2d2d;
      border-radius: 4px;
      padding: 2px 6px;
    }
    .sidebar-toggle {
      display: flex !important;
      align-items: center;
      justify-content: center;
    }

    /* === Tarjetas de pregunta y respuesta === */
    .markdown-section .qa-card {
      border: 1px solid #e0e0e0;
      border-left: 4px solid var(--theme-color);
      border-radius: 6px;
      padding: 14px 18px;
      margin: 20px 0;
      background: #fafafa;
      font-size: 0.92rem;
    }
    .markdown-section .qa-card > *:first-child {
      margin-top: 0;
    }
    .markdown-section .qa-card > *:last-child {
      margin-bottom: 0;
    }
    .markdown-section .qa-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: 3px;
      margin-bottom: 8px;
      color: #fff;
      vertical-align: middle;
    }
    .markdown-section .qa-tag-q {
      background: var(--theme-color);
    }
    .markdown-section .qa-tag-a {
      background: #2e7d32;
    }
    .markdown-section .qa-q p {
      font-weight: 600;
      margin: 0;
    }
    .markdown-section .qa-a {
      border-top: 1px dashed #dcdcdc;
      margin-top: 10px;
      padding-top: 10px;
    }
    .markdown-section .qa-card details {
      border-top: 1px dashed #dcdcdc;
      margin-top: 12px;
      padding-top: 10px;
    }
    .markdown-section .qa-card summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--theme-color);
      list-style: none;
    }
    .markdown-section .qa-card summary::-webkit-details-marker {
      display: none;
    }
    .markdown-section .qa-card summary::before {
      content: '▸ ';
      color: #9e9e9e;
    }
    .markdown-section .qa-card details[open] summary::before {
      content: '▾ ';
    }
    .markdown-section .qa-card pre {
      margin: 10px 0 0;
    }
    .markdown-section .qa-card table {
      display: table;
      width: 100%;
    }
    @media screen and (max-width: 768px) {
      .markdown-section .qa-card {
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <div id="app">Cargando...</div>
  <script>
    window.$docsify = {
      name: 'mijelDevNotes',
      repo: '',
      basePath: 'docs',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Buscar',
        noData: 'Sin resultados',
        depth: 3,
        hideOtherSidebarContent: false
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      },
      mermaid: {
        theme: 'dark'
      },
      copyCode: {
        buttonText: 'Copiar',
        errorText: 'Error',
        successText: 'Copiado'
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1/dist/docsify-tabs.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
  </script>
</body>
</html>
